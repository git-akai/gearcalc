name: Test and deploy

on:
  pull_request:
  push:
  workflow_dispatch:

# One deploy at a time, and a queued one waits rather than cancelling: the
# published site should end up at the newest commit that passed, not at whichever
# job happened to survive a race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Off explicitly. Left at its default the action attempts a FlakeHub
          # login, which fails on this repo and leaves a red annotation on an
          # otherwise green run — the kind of noise that trains you to ignore
          # annotations. Turn it on together with a cache, not before.
          determinate: false

      # No binary cache action here on purpose. Determinate's magic-nix-cache
      # was sunset for general use and now needs FlakeHub auth, and a cache that
      # silently stops working is worse than a slower build that does not. Add
      # one deliberately (FlakeHub or Cachix, with its secret) if CI time
      # becomes a problem — the from-scratch build is ~5 min today.

      # Everything CI needs to check: build, clippy --deny warnings, fmt, tests.
      - run: nix flake check -L

      # The deployable browser build. Separate from `flake check` because it
      # pulls the Node toolchain, and a failure here is a packaging problem
      # rather than a code one.
      - run: nix build .#web -L

      # Every pointer from the code into the documents resolves to a heading
      # that exists. 389 of these went unchecked until the documents were
      # restructured, at which point every one of them would have broken
      # silently.
      - name: Documentation pointers resolve
        run: nix develop --command tools/check_doc_links.py

      # Every `ui.` message is used and every use has a message. The Rust side
      # checks itself; this is the half no `Note` stands behind.
      - name: The string catalogue is complete
        run: nix develop --command tools/check_strings.py

      # The committed TypeScript in `web/src/wire` is generated from the Rust
      # types. Regenerating it and requiring no diff is what stops it becoming a
      # third copy of the boundary that drifts like the hand-written one did.
      - name: The generated bindings are up to date
        run: nix develop --command tools/check_bindings.sh

      # Types are stripped by the bundler without being checked, so a type
      # error would otherwise only surface at runtime in the browser.
      - name: Typecheck the front end
        run: nix develop --command bash -c 'cd web && npm ci && npm run check'

      # Read an exported DXF back with ezdxf. The Rust tests can only show the
      # writer agrees with itself; this shows an unrelated parser gets the same
      # gear out.
      - name: Validate DXF export against an independent parser
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            cargo run -q --release --bin gear-cli -- dxf 17 0.2 0.001 > /tmp/gear17.dxf
            python3 tools/validate_dxf.py /tmp/gear17.dxf \
              --root 7.45 --tip 9.7 --base 7.987387276680222 --pitch 8.5 --teeth 17
          '

      # ---- and, on `main` only, hand the site to the deploy job -------------
      #
      # Packaged **here** rather than in `deploy` so the site is the one these
      # checks just passed, byte for byte, and so the ~5 minute nix build is not
      # paid for twice. `result` is a symlink into the read-only store, which the
      # upload cannot tar: `-L` dereferences it and the `chmod` makes the copy
      # writable.
      - name: Package the site
        if: github.ref == 'refs/heads/main'
        run: cp -rL result public && chmod -R u+w public

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # A separate job only because `deploy-pages` wants permissions the test job has
  # no business holding — it publishes, so it can write Pages and mint an OIDC
  # token, and nothing that runs project code should be able to.
  #
  # `needs: tests` is the point of merging the two workflows: the site cannot
  # move unless `nix flake check`, the four consistency checks, the typecheck and
  # the independent DXF read have all passed on that commit.
  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
