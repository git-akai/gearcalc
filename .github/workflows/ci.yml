name: Test and deploy

on:
  pull_request:
  push:
  workflow_dispatch:

# One run per ref at a time. GitHub keeps at most one running and one pending
# run in a group, and a newer run always replaces a pending one; on a pull
# request it also cancels the running one (a commit nobody will merge), and on
# a branch a running check finishes, so the newest push is always checked but
# a push that lands while two others queue behind a running one is skipped.
# The deploy serialises on its own group, below. `tools/ci_steps.py` holds
# this, the jobs' permissions and deploy-on-main-only as a policy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    # Reads the repository and nothing else: this job runs project code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Off explicitly. Left at its default the action attempts a FlakeHub
          # login, which fails on this repo and leaves a red annotation on an
          # otherwise green run — the kind of noise that trains you to ignore
          # annotations. Turn it on together with a cache, not before.
          determinate: false

      # No binary cache action here on purpose. Determinate's magic-nix-cache
      # was sunset for general use and now needs FlakeHub auth, and a cache that
      # silently stops working is worse than a slower build that does not. Add
      # one deliberately (FlakeHub or Cachix, with its secret) if CI time
      # becomes a problem — the from-scratch build is ~5 min today.

      # The checks that take seconds run first, so a dead pointer or a
      # unitless angle is reported before the five-minute build.

      # This job's steps are the one list of what CI runs: `tools/check_all.sh`
      # runs each of them locally and refuses a step it has not classified.
      - name: check_all.sh runs what this job runs
        run: nix develop --command tools/check_all.sh --list

      # Every pointer from the code and the documents resolves: the file it
      # names exists and so does the heading. These went unchecked until the
      # documents were restructured, when every one of them would have broken
      # silently.
      - name: Documentation pointers resolve
        run: nix develop --command tools/check_doc_links.py

      # Every `ui.` message is used and every use has a message. The Rust side
      # checks itself; this is the half no `Note` stands behind.
      - name: The string catalogue is complete
        run: nix develop --command tools/check_strings.py

      # Every angle says what unit it is in, and no name means both. The crate
      # works in degrees where a designer states a number and radians in the
      # mathematics, which is right; a *name* that means one in one module and
      # the other in the next is how that becomes a bug, and it did.
      - name: Angular units are unambiguous
        run: nix develop --command tools/check_units.py

      # The figure checker's own rules, on a fixture: the fixture passes and
      # every planted fault (a drifted figure, rows swapped, a figure a test
      # does not hold, ...) fails. A gate is seen failing before it is trusted.
      - name: The figure checker fails on planted faults
        run: nix develop --command tools/check_figures.py --self-test

      # Derivations that share no code with the crate, each held to what the
      # harness recorded in tools/golden/ (which check_golden.sh holds to the
      # harness): the train's speeds from rigid-body motion, the hula ratio
      # from the no-slip condition, the flow's efficiencies from the
      # carrier-frame closed form, and the crossed pair's zone off its
      # surfaces. A defect in the crate reaches the corpus and fails here.
      - name: Independent derivations agree with the recorded crate
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            python3 tools/train_kinematics.py
            python3 tools/hula_kinematics.py
            python3 tools/breakaway.py
            python3 tools/crossed_path.py
          '

      # Everything CI needs to check: build, clippy --deny warnings, fmt, tests.
      - run: nix flake check -L

      # The timing canaries, alone and one at a time. The suite's gates count
      # work (teeth cut, candidates evaluated), which no machine changes; these
      # say the order of magnitude a count cannot, and wall-clock in a parallel
      # suite measured the machine as much as the code.
      - name: Timing canaries, serially
        run: nix develop --command cargo nextest run --run-ignored only --test-threads 1

      # The deployable browser build. Separate from `flake check` because it
      # pulls the Node toolchain, and a failure here is a packaging problem
      # rather than a code one.
      - run: nix build .#web -L

      # The committed TypeScript in `web/src/wire` is generated from the Rust
      # types. Regenerating it and requiring no diff is what stops it becoming a
      # third copy of the boundary that drifts like the hand-written one did.
      - name: The generated bindings are up to date
        run: nix develop --command tools/check_bindings.sh

      # Types are stripped by the bundler without being checked, so a type
      # error would otherwise only surface at runtime in the browser.
      - name: Typecheck the front end
        run: nix develop --command bash -c 'cd web && npm ci && npm run check'

      # The panels mounted in jsdom against the real core: what a reader types
      # and what the boxes then show, which neither the typecheck nor any Rust
      # test sees.
      - name: Front-end tests
        run: nix develop --command bash -c 'cd web && npm ci && npm test'

      # Everything the harness prints, and every figure the documents quote.
      #
      # The suite asserts properties, which means it can only notice a number
      # some test names. `docs/corrections.md` records three documented tables
      # found stale in one session and a figure misattributed to the change in
      # hand — both found by running the old code and reading *all* of its
      # output, which is what these two do mechanically.
      #
      # One release build, which check_golden.sh makes, serves both, and the
      # corpus is run **whole** — about a minute, of which the figure check
      # would have paid for two commands anyway. `--fast` exists for a working tree, not for here: a partial check
      # that reads as a complete one is the failure this project keeps recording.
      - name: The harness prints what it printed, and the documents quote it
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            tools/check_golden.sh
            tools/check_figures.py
          '

      # **The payload, executed.** Everything above checks the boundary without
      # running it: the binding check compares its generated *shape* against the
      # Rust, the suite exercises `gear-core` natively, and the corpus records
      # what the CLI prints. The `.wasm` the browser downloads was run by
      # nothing — so a build step that rewrites the module could ship a payload
      # that computes differently with every check green. `nix build .#web` now
      # runs `wasm-opt` over it, which is exactly such a step.
      - name: The payload runs, and optimising it changes no answer
        run: nix develop --command tools/check_wasm.sh

      # Read exported DXFs back with ezdxf and check each arc from its chord
      # and bulge against the gear derived from its inputs. The Rust tests can
      # only show the writer agrees with itself; this shows an unrelated parser
      # gets the same gear out -- a shifted gear, an undercut one, an eccentric
      # one, an eccentric one whose highest tooth sets the shared tool deeper
      # than the dedendum, and a ring.
      - name: Validate DXF export against an independent parser
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            cli="cargo run -q --release --bin gear-cli --"
            out="$(mktemp -d)"
            trap "rm -rf $out" EXIT
            $cli dxf 17 0.2 0.001 > $out/gear17.dxf
            python3 tools/validate_dxf.py $out/gear17.dxf --teeth 17 --shift 0.2
            $cli dxf 9 -0.3 0.001 > $out/gear9.dxf
            python3 tools/validate_dxf.py $out/gear9.dxf --teeth 9 --shift -0.3
            $cli dxf 24 0 0.001 0.25 > $out/gear24e.dxf
            python3 tools/validate_dxf.py $out/gear24e.dxf --teeth 24 --angular-shift 0.25
            $cli dxf 40 1 0.001 0.5 > $out/gear40e.dxf
            python3 tools/validate_dxf.py $out/gear40e.dxf --teeth 40 --shift 1 --angular-shift 0.5
            $cli dxf ring 43 0 0.001 > $out/ring43.dxf
            python3 tools/validate_dxf.py $out/ring43.dxf --ring --teeth 43
          '

      # ---- and, on `main` only, hand the site to the deploy job -------------
      #
      # Packaged **here** rather than in `deploy` so the site is the one these
      # checks just passed, byte for byte, and so the ~5 minute nix build is not
      # paid for twice. `result` is a symlink into the read-only store, which the
      # upload cannot tar: `-L` dereferences it and the `chmod` makes the copy
      # writable.
      - name: Package the site
        if: github.ref == 'refs/heads/main'
        run: cp -rL result public && chmod -R u+w public

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # A separate job only because `deploy-pages` wants permissions the test job has
  # no business holding — it publishes, so it can write Pages and mint an OIDC
  # token, and nothing that runs project code should be able to.
  #
  # `needs: tests` is the point of merging the two workflows: the site cannot
  # move unless every step of the tests job has passed on that commit.
  #
  # One deploy at a time: a running deploy finishes, and a newer one replaces
  # any still queued, so the site ends up at the newest commit that passed.
  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
