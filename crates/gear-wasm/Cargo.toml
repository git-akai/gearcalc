[package]
name = "gear-wasm"
description = "The WebAssembly boundary. Thin by design: three functions, JSON in, JSON out."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gear-core = { path = "../gear-core", features = ["serde"] }
gear-io = { path = "../gear-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same role as in `gear-core`: the front end stops hand-copying the shapes that
# cross this boundary, so a renamed field is a type error rather than a panel
# that quietly renders nothing.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"], optional = true }
# Pinned exactly: the generated bindings must match the `wasm-bindgen-cli` that
# processes them, and that CLI comes from nixpkgs via flake.nix. A floating
# version here silently breaks the build whenever the two drift apart.
wasm-bindgen = "=0.2.121"

[lints]
workspace = true

[features]
default = []
typescript = ["dep:ts-rs", "gear-core/typescript"]
