# 本專案向使用者顯示的全部文字，繁體中文。
#
# 譯自 `strings_en.toml`。**鍵名是程式碼使用的名稱**——只翻譯值，不要更動鍵。
# 測試會核對每個語言檔的鍵集與英文完全一致，因此缺少或杜撰的鍵會被發現，
# 而不會被發布出去。
#
# `{像這樣}` 由計算核心填入一個**已經格式化好**的數值：一個量該保留幾位小數，
# 是關於這個量本身的判斷，在模型那一側決定，而不在這裡。佔位符可以移到文法
# 需要的位置，但不能憑空新增。
#
# 關於行文風格、各分區的意義，以及為什麼一則訊息只佔一行，請參見
# `strings_en.toml`；那些規則在這裡同樣適用。
#
# 說明：本譯文由機器翻譯產生，尚未經專業人員校閱。術語依照臺灣常用的齒輪
# 術語（CNS 相關標準）。歡迎指正——修改譯文不會改變任何計算結果。

