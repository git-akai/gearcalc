# Todas as palavras que este projeto mostra a uma pessoa, em português.
#
# Traduzido de `strings_en.toml`. **As chaves são nomes usados pelo código** —
# traduza só os valores, nunca as chaves. Um teste verifica que cada ficheiro de
# idioma tem exatamente o mesmo conjunto de chaves do inglês, pelo que uma chave
# em falta ou inventada é apanhada em vez de publicada.
#
# `{assim}` é preenchido pelo núcleo com um valor **já formatado**: quantas casas
# decimais uma grandeza merece é um juízo sobre essa grandeza, feito junto ao
# modelo e não aqui. Um marcador pode mudar para onde a gramática precisar dele,
# mas não pode ser inventado.
#
# Para o estilo, o significado de cada secção e a razão de cada mensagem ocupar
# uma só linha, ver `strings_en.toml`; as regras aplicam-se aqui sem alteração.
#
# NOTA: esta tradução foi feita por máquina e ainda não foi revista por um
# profissional. A terminologia segue o vocabulário corrente de engrenagens em
# português, com a grafia do Acordo Ortográfico; onde as normas europeia e
# brasileira divergem, foi escolhida a forma mais reconhecível em ambas.
# Correções são bem-vindas e não alteram nenhum cálculo.

