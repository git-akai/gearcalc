# Every word this project shows a person, in English.
#
# This file is the whole of the user-facing language: the notes the solve
# generates, and the labels the application draws around them. Nothing here is
# engineering — no value in this file changes an answer — so it can be
# translated, reworded or proof-read without reading a line of Rust.
#
# ## How to translate it
#
# Copy this file to `strings_<code>.toml` and replace the values, never the
# keys. A key is a name the code uses; changing one breaks the message rather
# than translating it. The set of keys is fixed by the code and checked by a
# test, so a missing key or an invented one is caught rather than shipped.
#
# ## Placeholders
#
# `{like_this}` is filled in by the core with a value it has **already
# formatted** — how many decimals a quantity deserves is a judgement about what
# the quantity means, so it is made next to the model and not here. Move a
# placeholder wherever the grammar needs it, but do not invent one: a test
# checks that every placeholder a message uses is one the code supplies.
#
# ## One line per message
#
# However long it runs. TOML has no line limit and nothing here reads the file by
# line, so a wrapped value bought source width and cost a translator the ability
# to see, search or replace a message as one string — and the continuation
# backslash silently eats the following line's leading whitespace, which is a way
# to join two words by accident. If a message is too long to read on one line,
# shorten the message.
#
# ## Where these appear
#
# `[clamp]`   a guard rail fired, and the geometry is not quite what was asked
#             for. Shown against the gear or member it happened to.
# `[part]`    something about a solved part its designer should read.
# `[ui]`      the application's own chrome: labels, headings, buttons, units,
#             and the fixed explanatory notes beside inputs.
#
# ## House style
#
# Six rules, so a hundred messages read as one voice rather than a hundred.
#
# 1. **A label is a name**, in sentence case with no closing punctuation:
#    "Pitch diameter", "Tooth count". Only the first word and proper nouns are
#    capitalised.
# 2. **A note is a fragment**, lowercase and unpunctuated at the end. It hangs
#    off a value or a field and finishes a thought the number started.
# 3. **A statement the application makes in its own voice** — a warning bullet,
#    a paragraph of guidance — is a sentence: capital, full stop.
# 4. **`value: consequence`.** Where a message reports a figure and then says
#    what it means, the colon separates them, and the figure comes first. This
#    is what lets clamp and part notes be skimmed down the left.
# 5. **Cut the leading article.** A note is read in the second it takes to glance
#    at it, and "the cutter has no usable tip corner" says nothing that "cutter
#    has no usable tip corner" does not. Definite articles at the start of a
#    fragment go; an indefinite one stays where it is doing work ("a ring is
#    shaped by a pinion" is a general statement, not this ring).
# 6. **One sentence unless a second earns its place.** Most notes that ran to two
#    were restating the first in other words.
#
# And one rule about which messages exist at all: **a note earns its line by
# saying something the number cannot.** Restating a label in longer words, or
# explaining a field whose name already explains it, is noise that makes the
# notes worth reading get skipped. Where there is nothing non-obvious to say,
# there is no note.

# ---------------------------------------------------------------- clamps
#
# These fire when input cannot describe a real gear. They encode no physics;
# they stop a NaN or a self-intersecting outline from being returned silently.
#
# Each reads `what changed: why`, so the change is the first thing seen. Lengths
# carry their unit, because a bare number beside a radius is ambiguous.

[clamp]
pressure_angle_raised = "pressure angle increased to {degrees}°"
dedendum_raised = "dedendum increased: cutter had no depth left"
dedendum_capped = "dedendum capped: root circle would reach the axis"
tooth_thickness_raised = "tooth thickness increased: shift or thickness modification too negative"
tooth_thickness_capped = "tooth thickness capped: shift or thickness modification too positive"
fillet_capped = "fillet capped to {radius} mm: tooth space holds no larger round"
tip_capped_pointed = "tip capped at {radius} mm: tooth comes to a point there"
tooth_severed = "tooth severed by undercut"
tooth_undercut = "undercut: cutter has removed part of the flank near the root"
cutter_no_tip_corner = "no fillet: cutter has no usable tip corner"
ring_space_capped = "space width capped: shift or thickness modification too positive"
ring_space_raised = "space width increased: shift or thickness modification too negative"
ring_space_closed = "tooth space closes at radius {radius} mm where flanks meet: root is truncated"
ring_tip_raised = "tip radius increased to {radius} mm: below it, the tooth has no thickness"
cutter_teeth_reduced = "cutter reduced to {teeth} teeth: ring needs more teeth than its shaper"
ring_flank_ungenerated = "flank below {limit} mm not generated; increase cutter teeth"
ring_fully_filleted = "fully filleted root: corner rounds meet, leaving no root arc"
ring_flank_fillet_gap = "flank and fillet do not meet: cutter does not reach this ring's flank; profile not generated"

# ----------------------------------------------------------------- part notes
#
# Shown as bullets naming the part they are about — its search, its closures,
# its planets. Each leads with the figure it is about, so a reader scanning the
# list sees the numbers first.

[part]
distance_not_reached = "no admissible shifts reach {asked} mm: the pair is built at {reached} mm instead, and the clearance reported is the gap"
clearance_negative = "the running distance is {overlap} mm inside the zero-backlash {nominal} mm: these teeth cannot be assembled"
optimiser_found_nothing = "no solution within the admissible range; shifts remain unaltered"
overlap_unreachable = "no helix reaches an axial contact ratio of {ratio} at this face width; the helix stands"
overlap_needs_helix = "axial contact ratio {ratio} asks nothing of straight teeth: no face width buys overlap at zero helix; give a helix angle, or every face width for the ratio to decide it"
planets_share_load_equally = "{planets} planets assumed to share load equally; real sets do not without a floating member, and the remedy is a mesh-load factor this tool declines to apply"
planets_not_evenly_spaced = "{planets} planets cannot be evenly spaced: sun and ring tooth counts do not sum to a multiple of planet count"
planet_clearance_below_minimum = "adjacent planets clear by {gap} mm, below the {minimum} mm asked for"

# ---------------------------------------------------------------- gear notes
#
# A finding about one gear — a bound that moved its number, a root
# loaded both ways, a rim too thin to rate, a face nothing sizes. Drawn on that
# gear's own card, so none names a gear.

[gear]
shift_raised_for_undercut = "profile shift increased to {shift} to prevent undercut"
addendum_held_to_tip_width = "addendum limited to {addendum}"
face_width_as_entered = "automatic face width has nothing to size it on crossed shafts: it stands as entered"
bending_unrated_in_mesh = "bending not rated on the flank mesh {mesh} loads: its load point leaves no root section there; the other flank's rating stands"
ring_addendum_clamped = "ring addendum clamped at base circle; add more teeth or shorten the addendum"
face_width_no_source = "automatic face width has no rating to size it: every source is switched off; width remains unaltered"
rim_below_minimum = "rim backup ratio {ratio} is at or below the minimum ISO 6336-3 will rate: the clause says such a rim shall be avoided, and Y_B is reported past where the standard goes"
reversed_bending_uncorrected = "root is loaded by both flanks and is rated against the one-directional allowable: switch reversed bending on to rate against the reduced allowable"
reversed_bending_applied = "root is loaded by both flanks and is rated against {fraction} of the one-directional allowable"

# ---------------------------------------------------------------- mesh notes
#
# A finding about one mesh, drawn beside the figure it is about — the contact
# ratio, the efficiency, the bending stress. A gear in two meshes says which.

[mesh]
overlap_below_one = "axial contact ratio below 1; helical in form but loaded like a spur gear"
contact_ratio_below_one = "contact ratio {ratio}: below 1, the pair loses contact between teeth"
load_sharing_out_of_band = "load sharing at a virtual contact ratio of {ratio} is out of band; extrapolated result can vary from -24% to +15%"
self_locking = "self-locking: static μ {friction} against a threshold of {threshold}, so the second member cannot drive the first"
near_self_locking = "close to self-locking: static μ {friction} near threshold of {threshold}, so back-driving changes on an estimated coefficient"
forward_locking = "cannot be driven forward: static μ {friction} against a threshold of {threshold}, so the first member cannot drive the second"
near_forward_locking = "close to not driving forward: static μ {friction} near threshold of {threshold}, so whether it drives changes on an estimated coefficient"
low_efficiency = "mesh efficiency {percent} %: most of the input becomes heat, which usually limits a crossed-axis stage before stress does"

# ------------------------------------------------------------------- the train
#
# Facts about the whole shaft line, which no single part is in a position to
# say: an input clamped against the peak it is measured from, and where a
# back-driving load is reacted.

[train]
load_not_reacted = "nothing holds this load: the train turns under it and carries none of it — react a port, or a mesh that locks holds it"
case_no_load = "no load on any port: mark one or more ports as loads"
case_underdetermined = "motion undecided: {short} more speed(s) to give, or one fewer port to leave free"
case_nothing_drives = "no given torque does any work — every load is nought or on a still port: nothing drives this case"
load_shared = "held at both ends: how the load divides is a matter of stiffness this model does not state — hold one end only, or let a self-locking mesh hold it"

[preview]
nothing = "changes nothing"
gears = "gears: {before} → {after}"
meshes = "meshes: {before} → {after}"
axes = "axes: {before} → {after}"
bodies = "bodies: {before} → {after}"
distances = "axis distances: {before} → {after}"
couplings = "offset couplings: {before} → {after}"
holds = "holds: {before} → {after}"
case_entries = "case entries: {before} → {after}"
path = "Body {from} to Body {to}: ratio {ratio_before_from} : {ratio_before_to} → {ratio_after_from} : {ratio_after_to}, efficiency {efficiency_before} → {efficiency_after} %"
path_gone = "Body {from} to Body {to}: no longer a path"
path_new = "Body {from} to Body {to}: a path, ratio {ratio_from} : {ratio_to}, efficiency {efficiency} %"

# ---------------------------------------------------------------- the application
#
# The chrome: what the application calls things. Nothing here has a `Note`
# behind it, so these keys are exempt from the "every message is one the core
# emits" check — they are the only exemption. `tools/check_strings.py` covers
# this section instead, in both directions.
#
# Kept in one alphabetical run. There is no grouping to get wrong, a new key has
# exactly one right place, and a duplicate sorts next to what it duplicates.

[error]
# Why a result does not exist. These were `Display` impls inside `gear-core` —
# the last English in a crate whose rule is that it holds none, and the messages
# a user meets when something has gone wrong, which are the ones that most need
# translating.
mesh_incompatible = "the gears cannot mesh: module, pressure angle or helix differ"
mesh_ring_too_small = "an internal mesh needs more teeth on the ring than the pinion"
mesh_outside_involute_domain = "profile shifts leave no operating pressure angle"
mesh_axis_distance_too_small = "the axis distance is below the base-circle limit"
measure_no_valid_span = "no span contacts the usable flank on this gear"
measure_pin_too_small = "the pin or ball is too small"
measure_pin_too_large = "the pin or ball is too large"
screw_not_positive = "a module, diameter or tooth count is not positive"
screw_worm_too_thin = "the first member has no lead angle; put the helical member first and the spur one second"
screw_shaft_angle_impossible = "the shaft angle leaves the second member with no lead angle"
screw_first_member_is_a_disc = "the first member's helix angle reaches ninety degrees, which is a disc rather than a gear"
screw_axes_are_parallel = "a worm stage needs non-parallel shafts"
train_no_contact = "the teeth never contact"
train_no_common_distance = "no profile shift brings the meshes to one axis distance; these tooth counts cannot be assembled"
train_wiring = "these gears describe no mechanism: a member with no teeth, or two gears whose axes cannot stay a fixed distance apart"
train_unknown_material = "no material named {name} in the library"
train_no_root_section = "the tooth is too undercut to have a root section"
train_load_port = "load case {case} enters by a body no load can be put on: ground, a held body, or one that is not a port"
train_overdetermined = "two conditions cannot both hold at body {body}: what it is asked to do contradicts what the meshes and the other conditions already decide"
train_no_such_body = "a constraint or load case names a body the train does not have: body {body}"
train_overflow = "the tooth counts along the shaft line multiply past what an exact ratio can hold"
train_tips_unclearable = "mesh {mesh}: no distance clears the teeth"

