mesh_ring_too_small = "an internal mesh needs more teeth on the ring than the pinion"
mesh_outside_involute_domain = "these profile shifts leave no operating pressure angle: the base circles would have to overlap"
mesh_centre_distance_too_small = "centre distance is below the base-circle limit"
measure_no_valid_span = "no span contacts the usable flank on this gear"
measure_pin_off_flank = "the pin touches outside the usable flank"
measure_pin_bottoms_out = "the pin sits on the root diameter, not the flanks"
measure_pin_too_small = "the pin is too small: it falls between the flanks into the root"
measure_pin_too_large = "the pin is too large: contact would fall below the base circle"
screw_not_positive = "a module, diameter or tooth count is not positive"
screw_worm_too_thin = "the first member has no lead angle: sized by diameter, the worm is too thin for that many starts at that module and its thread would have to wrap at ninety degrees or more; sized by helix angle, a zero helix makes it a spur gear, which has no lead at all — put the helical member first and the spur one second"
