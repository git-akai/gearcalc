# Every word this project shows a person, in English.
#
# This file is the whole of the user-facing language: the notes the solve
# generates, and the labels the application draws around them. Nothing here is
# engineering — no value in this file changes an answer — so it can be
# translated, reworded or proof-read without reading a line of Rust.
#
# ## How to translate it
#
# Copy this file to `strings_<code>.toml` and replace the values, never the
# keys. A key is a name the code uses; changing one breaks the message rather
# than translating it. The set of keys is fixed by the code and checked by a
# test, so a missing key or an invented one is caught rather than shipped.
#
# ## Placeholders
#
# `{like_this}` is filled in by the core with a value it has **already
# formatted** — how many decimals a quantity deserves is a judgement about what
# the quantity means, so it is made next to the model and not here. Move a
# placeholder wherever the grammar needs it, but do not invent one: a test
# checks that every placeholder a message uses is one the code supplies.
#
# ## Where these appear
#
# `[clamp]`   a guard rail fired, and the geometry is not quite what was asked
#             for. Shown against the gear or member it happened to.
# `[stage]`   something about a solved stage its designer should read.
# `[ui]`      the application's own chrome: labels, headings, buttons, units,
#             and the fixed explanatory notes beside inputs.

# ---------------------------------------------------------------- clamps
#
# These fire when input cannot describe a real gear. They encode no physics;
# they stop a NaN or a self-intersecting outline from being returned silently.

[clamp]
pressure_angle_raised = "pressure angle raised to {degrees} deg"
dedendum_raised = "dedendum raised: cutter depth was <= 0"
dedendum_capped = "dedendum capped: root radius would be <= 0"
tooth_thickness_raised = "tooth thickness raised: profile shift or thickness modification too negative"
tooth_thickness_capped = "tooth thickness capped: profile shift or thickness modification too positive"
fillet_capped = "fillet capped to {radius} (tooth space too tight)"
tip_capped_pointed = "tip capped at pointed-tooth radius {radius}"
tooth_severed = "tooth severed by undercut: profile truncated at the centreline"
cutter_no_tip_corner = "the cutter has no usable tip corner; no fillet generated"

ring_space_capped = """\
space width capped: profile shift or thickness modification too positive, and \
a ring needs a tooth left over"""
ring_space_raised = """\
space width raised: profile shift or thickness modification too negative, and \
the mating pinion's tooth has to fit"""
ring_tip_raised = """\
tip radius raised to {radius} mm: below that a ring's tooth has no thickness \
left — either its addendum reaches inside its own base circle, or its flanks \
meet before they get there"""
cutter_teeth_reduced = """\
cutter reduced to {teeth} teeth: a ring must have more teeth than the shaper \
that cuts it, or there is no inside to cut from"""
ring_flank_ungenerated = """\
the flank below {limit} mm is not generated by this cutter — its own involute \
runs out there, so the tip {tip} mm is inside the generated region. A cutter \
with more teeth reaches further"""
ring_fully_filleted = """\
fully filleted root: the corner rounds meet before mid-space, so there is no \
root arc"""
ring_flank_fillet_gap = """\
flank and fillet do not meet: the cutter does not reach this ring's flank, so \
the profile is not generated"""

# ---------------------------------------------------------------- stage notes

[stage]
overlap_below_one = """\
overlap ratio {ratio} is below 1: the stage is helical in form but still \
transfers load like a spur gear"""
transverse_contact_ratio_below_one = """\
transverse contact ratio {ratio} is below 1: the mesh loses contact between \
teeth"""
crossed_face_width_as_entered = """\
gear {member}'s face width used as entered: its teeth do not reach a full \
contact ratio at any width, so there is no width that would keep contact \
continuous"""
crossed_contact_ratio_below_one = """\
contact ratio {ratio}: below 1 the pair loses contact between one tooth and \
the next, whatever the stresses say. A crossed pair's face width bounds this \
where a parallel pair's does not — see the width for continuity beside it"""
self_locking = """\
self-locking at a static mu of {friction}: the wheel cannot break the worm away \
at all, so it cannot back-drive it (the threshold is {threshold})"""
near_self_locking = """\
close to self-locking: a static mu of {friction} against a threshold of \
{threshold}, so whether it back-drives depends on a friction coefficient nobody \
measured"""
low_mesh_efficiency = """\
mesh efficiency {percent} % — most of the input becomes heat, and a worm drive \
is usually limited by that rather than by stress"""
proportions_not_applicable = """\
face widths left as entered: the published proportions are for a worm carrying \
an enveloping wheel, and a crossed gear pair has neither"""
planets_share_load_equally = """\
the {planets} planets are assumed to share the load equally; real sets do not \
without a floating member, and the usual remedy is a mesh-load factor this \
project declines to apply on the designer's behalf"""
planets_not_evenly_spaced = """\
{planets} planets cannot be spaced evenly: (z_sun + z_ring) is not divisible \
by it"""
planet_clearance_below_minimum = """\
adjacent planets clear by {gap} mm, below the {minimum} mm asked for"""
ring_addendum_clamped = """\
the ring's addendum was clamped at its base circle: it needs more teeth or a \
shorter addendum"""

