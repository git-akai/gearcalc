# Jedes Wort, das dieses Projekt einer Person zeigt, auf Deutsch.
#
# Übersetzt aus `strings_en.toml`. **Die Schlüssel sind Namen, die der Code
# benutzt** — übersetzt werden nur die Werte. Ein Test hält jede Sprachdatei auf
# genau denselben Schlüsselsatz, ein fehlender oder erfundener Schlüssel fällt
# also auf, statt ausgeliefert zu werden.
#
# `{so_etwas}` wird vom Kern mit einem bereits **formatierten** Wert gefüllt:
# wie viele Nachkommastellen eine Größe verdient, ist eine Aussage über die
# Größe und wird beim Modell entschieden, nicht hier. Ein Platzhalter darf dahin
# wandern, wo die Grammatik ihn braucht — erfinden lässt er sich nicht.
#
# Zum Haus-Stil, zu den Abschnitten und dazu, warum eine Nachricht auf einer
# Zeile steht, siehe `strings_en.toml`; die Regeln gelten hier unverändert.
#
# HINWEIS: Diese Übersetzung wurde maschinell erstellt und ist von einer
# Fachperson noch nicht geprüft worden. Die Fachbegriffe folgen dem üblichen
# deutschen Verzahnungsvokabular (DIN 3960 und verwandte); Korrekturen sind
# willkommen und ändern keine Berechnung.

