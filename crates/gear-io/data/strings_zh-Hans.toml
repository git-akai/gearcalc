# 本项目向用户显示的全部文字，简体中文。
#
# 译自 `strings_en.toml`。**键名是代码使用的名称**——只翻译值，不要改动键。
# 测试会核对每个语言文件的键集与英文完全一致，因此缺少或臆造的键会被发现，
# 而不会被发布出去。
#
# `{像这样}` 由计算内核填入一个**已经格式化好**的数值：一个量该保留几位小数，
# 是关于这个量本身的判断，在模型那一侧决定，而不在这里。占位符可以移到语法
# 需要的位置，但不能凭空新增。
#
# 关于文风、各分区的含义，以及为什么一条消息只占一行，请参见 `strings_en.toml`；
# 那些规则在这里同样适用。
#
# 说明：本译文由机器翻译生成，尚未经专业人员校核。术语依照中国大陆常用的齿轮
# 术语（GB/T 3374 等）。欢迎指正——修改译文不会改变任何计算结果。

