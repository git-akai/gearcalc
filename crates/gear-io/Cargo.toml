[package]
name = "gear-io"
description = "File formats: DXF export, and the human-readable TOML documents."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gear-core = { path = "../gear-core", features = ["serde"] }
# TOML is a spec requirement: the material library and geartrains are exchanged
# as human-readable, hand-editable documents. Parsing it is I/O, not
# engineering, so the dependency lives here — `gear-core` stays serde-only.
serde = { version = "1", features = ["derive"] }
toml = "1"
# The document types cross to the front end as `gear-core`'s do: generated,
# so a renamed field is a type error there rather than a silent mismatch.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"], optional = true }

[lints]
workspace = true

[features]
default = []
typescript = ["dep:ts-rs", "gear-core/typescript"]
