[workspace]
resolver = "2"
members = ["crates/gear-core", "crates/gear-cli", "crates/gear-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/schlarpc/gears"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

enum_glob_use = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
# A calculation engine must not panic. Allowed per-module in tests.
unwrap_used = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The geometry test suite simulates the generating rack over thousands of cases;
# at opt-level 0 that is minutes instead of seconds.
[profile.test]
opt-level = 2
debug = true
