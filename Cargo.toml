[workspace]
resolver = "2"
members = ["crates/gear-core", "crates/gear-io", "crates/gear-cli", "crates/gear-wasm"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/schlarpc/gears"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }

enum_glob_use = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
# A calculation engine must not panic. Allowed per-module in tests.
unwrap_used = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The geometry test suite simulates the generating rack over thousands of cases;
# at opt-level 0 that is minutes instead of seconds.
[profile.test]
opt-level = 2
debug = true

# **The browser payload, and the one place its opt-level is decided.**
# `flake.nix` and `tools/check_wasm.sh` both build with `--profile wasm`, so
# there is no second copy of this choice to drift.
#
# `opt-level = "z"` here and 3 everywhere else, because the two targets are
# asked different questions. The CLI and the test suite simulate a generating
# rack over thousands of cases and want speed; the browser downloads the module
# once over a network and then runs one solve per keystroke. Measured, end to
# end, after `wasm-opt -Oz`:
#
#            payload    gzipped   solve_train   solve_gear   optimised train
#   opt 3   1,355,263   480,711      0.170 ms     0.041 ms         18.1 ms
#   opt "s" 1,305,165         —            —            —               —
#   opt "z" 1,209,487   427,195      0.273 ms     0.058 ms         20.5 ms
#
# So "z" costs 0.1 ms on the path a designer waits on — against a 16.7 ms frame
# — and buys 53 KB of transfer. The percentages read alarmingly (+61 % on
# `solve_train`) and the absolute numbers are what decides it: nothing here is
# near a budget. The optimised train is over a frame in both, and is opt-in.
[profile.wasm]
inherits = "release"
opt-level = "z"
